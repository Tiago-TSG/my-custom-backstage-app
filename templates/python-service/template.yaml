apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-microservice
  title: Microsserviço Python
  description: Cria um microsserviço Python com FastAPI, Dockerfile e catalog-info.yaml
  tags:
    - python
    - microservice
    - fastapi
spec:
  owner: group:time-backend
  type: service

  parameters:
    - title: Informações do serviço
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Nome do serviço
          type: string
          description: Apenas letras minúsculas, números e hífens. Entre 3 e 31 caracteres.
          pattern: '^[a-z][a-z0-9-]{2,30}$'
        description:
          title: Descrição
          type: string
        owner:
          title: Time responsável
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Repositório
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Localização do repositório
          type: string
          description: Informe o seu usuário do GitHub em Owner e o nome do novo repositório em Repository. O nome do repositório deve ter de 3 a 31 caracteres, com letras minúsculas, números e hífens, começando por letra.
          pattern: '^github\.com\?owner=[^&]+&repo=[a-z][a-z0-9-]{2,30}$'
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Gerar código a partir do skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: listar
      name: Listar arquivos gerados
      action: debug:log
      input:
        message: 'Serviço ${{ parameters.name }} gerado para ${{ parameters.owner }}'
        listWorkspace: true

    - id: publish
      name: Publicar no GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Registrar no catálogo
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repositório no GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Abrir no catálogo
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
